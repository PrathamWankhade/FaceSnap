name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ------------------------------------------------------------------
  # Backend
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
        working-directory: backend
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m ruff check app tests scripts
        working-directory: backend
      # Audit the environment that was just installed. `-r requirements.txt`
      # re-resolves and rebuilds the InsightFace sdist, which is slow and
      # flaky; `--local` audits exactly the versions this job will run.
      - run: python -m pip_audit --local --skip-editable --progress-spinner off
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./_ci_verify.db
      - run: rm -f _ci_verify.db
        working-directory: backend
        if: always()

  # ------------------------------------------------------------------
  # Secret scanning (gitleaks) — block commits containing keys/secrets
  # ------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Container image (GHCR) — built on every push to main. Deployment to a
  # host is a separate, environment-specific step (see docs/runbooks/deploy.md).
  # ------------------------------------------------------------------
  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
