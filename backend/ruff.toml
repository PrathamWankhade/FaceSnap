[lint]
# FaceSnap lint profile: error-only pyflakes/pycodestyle rules.
#
# This is ruff's classic default (E4/E7/E9 + F): undefined names, syntax
# errors, undefined exports, and unused imports/variables. Line length
# (E501) and the bugbear/bandit/style families are deliberately not enforced;
# FastAPI's Depends-in-defaults and the deliberate broad excepts in service
# code are idiomatic here.
select = ["E4", "E7", "E9", "F"]
