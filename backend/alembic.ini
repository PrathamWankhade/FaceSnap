# Alembic configuration for FaceSnap.
#
#   python -m alembic upgrade head        # apply migrations (run from backend/)
#   python -m alembic revision --autogenerate -m "..."
#   python -m alembic current | history | downgrade -1
#
# The URL comes from app.config (backend/.env or the DATABASE_URL environment
# variable) so migrations and the app can never point at different databases.
# See docs/runbooks/migrate.md.
[alembic]
script_location = alembic
prepend_sys_path = .
# template used to name new revision files
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is set in alembic/env.py from app.config.DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
